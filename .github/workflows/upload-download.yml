name: Upload to Download Site

# Manual-only upload of already-built artifacts. No compile, no GitHub
# release. Used to verify the WebDAV path or to re-publish assets after
# a failed build without rebuilding everything.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag used as the WebDAV directory (e.g. 1.5.3-2)'
        required: true
        type: string
      asset_url:
        description: 'Optional: download one asset from the GitHub release instead of uploading a file'
        required: false
        type: string

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          ASSET_URL: ${{ inputs.asset_url }}
        run: |
          set -e
          mkdir -p dist
          if [ -n "$ASSET_URL" ]; then
            echo "downloading $ASSET_URL"
            curl -sSfL "$ASSET_URL" -o "dist/$(basename "$ASSET_URL" | cut -d? -f1)"
          else
            # Pull everything already published on this tag.
            gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" --dir dist --clobber
          fi
          # Never feed the sidecars back as packages.
          rm -f dist/rustdesk-update.json dist/rustdesk-update.json.sig
          ls -la dist

      - name: Upload via aircore.top (SSH then internal WebDAV)
        shell: bash
        env:
          DOWNLOAD_SSH_KEY: ${{ secrets.DOWNLOAD_SSH_KEY }}
          DOWNLOAD_HOST: ${{ vars.DOWNLOAD_HOST }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          if [ -z "$DOWNLOAD_SSH_KEY" ]; then
            echo "::error::DOWNLOAD_SSH_KEY is not set"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DOWNLOAD_SSH_KEY" > ~/.ssh/dl_key
          chmod 600 ~/.ssh/dl_key
          ssh-keyscan -p 22 "$DOWNLOAD_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH="ssh -i ~/.ssh/dl_key -o StrictHostKeyChecking=accept-new root@${DOWNLOAD_HOST}"
          REMOTE="/tmp/rustdesk-upload-${TAG}"
          echo "clearing $REMOTE on the server"
          $SSH "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          echo "copying $(ls dist | wc -l) file(s) over SSH"
          scp -i ~/.ssh/dl_key -o StrictHostKeyChecking=accept-new \
            dist/* "root@${DOWNLOAD_HOST}:${REMOTE}/"
          echo "publishing from inside the server network"
          $SSH "sudo /usr/local/bin/rustdesk-webdav-publish.sh '$TAG' '$REMOTE' && rm -rf '$REMOTE'"

      - name: Verify public read
        shell: bash
        run: |
          set -e
          curl -sSfL -o /dev/null -w 'latest.html: %{http_code}\n' https://rustdesk.aircore.top:8888/download/latest.html
          curl -sSfL -o /dev/null -w 'version index: %{http_code}\n' https://rustdesk.aircore.top:8888/download/${{ inputs.tag }}/

