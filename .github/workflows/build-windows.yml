name: Build Windows Custom Client

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. 1.4.9 or 1.4.9-1)'
        required: true
        type: string
      upstream_ref:
        description: 'Upstream source ref (defaults to the release tag)'
        required: false
        type: string

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  LLVM_VERSION: "15.0.6"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  TOPMOST_COMMIT_ID: "ecd8d6a139eee76845ea66423fb739af450fda90"
  UPSTREAM_REPO: "rustdesk/rustdesk"
  SOURCE_REF: ${{ inputs.upstream_ref || inputs.tag }}
  TAG_NAME: "${{ inputs.tag }}"
  VERSION: "${{ inputs.tag }}"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  generate-bridge:
    name: Generate flutter bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.SOURCE_REF }}
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake curl gcc g++ git libclang-dev \
            libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge

      - name: Cache bridge deps
        uses: actions/cache@v4
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-${{ env.BRIDGE_FLUTTER_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Generate bridge
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # Flutter 3.22.3 needs a downgraded extended_text to resolve deps;
          # match any upstream version so a pubspec bump cannot break the sed.
          sed -i -E -e 's/(extended_text:[[:space:]]*)[0-9]+\.[0-9]+\.[0-9]+/\113.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          retention-days: 3
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build-topmost-window:
    name: Build top most window helper
    runs-on: windows-2022
    steps:
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Download the source code
        shell: pwsh
        run: |
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow

      - name: Build the project
        shell: pwsh
        run: |
          cd RustDeskTempTopMostWindow
          git checkout ${{ env.TOPMOST_COMMIT_ID }}
          msbuild WindowInjection/WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: topmostwindow-artifacts-x64
          retention-days: 3
          path: |
            ./RustDeskTempTopMostWindow/WindowInjection/x64/Release/WindowInjection.dll

  build-windows-x64:
    name: Build Windows x64
    needs: [generate-bridge, build-topmost-window]
    runs-on: windows-2022
    env:
      # Job-level so EVERY step (including in-build regeneration) sees the
      # same configuration. Do not duplicate these at step level.
      RD_ID_SERVER: ${{ secrets.RD_ID_SERVER }}
      RD_RELAY_SERVER: ${{ secrets.RD_RELAY_SERVER }}
      RD_API_SERVER: ${{ secrets.RD_API_SERVER }}
      RD_KEY: ${{ secrets.RD_KEY }}
      RD_PRESET_PASSWORD: ${{ secrets.RD_PRESET_PASSWORD }}
      RD_RELEASE_REPO: ${{ secrets.RD_RELEASE_REPO }}
      RD_WEBSOCKET_ID: ${{ secrets.RD_WEBSOCKET_ID }}
      RD_WEBSOCKET_RELAY: ${{ secrets.RD_WEBSOCKET_RELAY }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.SOURCE_REF }}
          submodules: recursive

      - name: Checkout this pipeline repo (for patches)
        uses: actions/checkout@v4
        with:
          path: pipeline

      - name: Normalize line endings of patched files
        shell: bash
        run: |
          # Patch hunks are LF-based; guarantee byte-exact context even for
          # trees without .gitattributes (hbb_common submodule). Binary mode
          # is mandatory here: MSYS sed -i writes CRLF on Windows.
          python3 - <<'EOF'
          import glob
          # Patch hunks are LF-based; the checked-out tree may be CRLF
          # (windows runners). Normalize BOTH sides or git apply mismatches.
          files = [
              "src/lib.rs", "src/core_main.rs", "src/common.rs", "src/ipc.rs",
              "flutter/lib/common.dart", "flutter/lib/models/server_model.dart",
              "flutter/lib/desktop/pages/server_page.dart",
              "flutter/lib/desktop/pages/desktop_home_page.dart",
              "flutter/lib/main.dart", "flutter/lib/mobile/widgets/dialog.dart",
              "libs/hbb_common/src/websocket.rs",
          ] + sorted(glob.glob("pipeline/patches/*.patch"))
          for f in files:
              try:
                  data = open(f, "rb").read()
              except FileNotFoundError:
                  continue
              fixed = data.replace(b"\r\n", b"\n")
              if fixed != data:
                  open(f, "wb").write(fixed)
                  print("normalized", f)
          print("done")
          EOF

      - name: Apply custom client patches
        shell: bash
        run: |
          # Numbered patches apply in order; a failure names the exact
          # functional domain that upstream changes broke.
          for p in ./pipeline/patches/*.patch; do
            echo "Applying $(basename "$p") ..."
            git apply --whitespace=nowarn --verbose "$p" || {
              echo "::error::Patch failed: $(basename "$p")"
              exit 1
            }
          done
          echo "All patches applied."

      - name: Generate embedded config from secrets
        shell: bash
        env:
          RD_ID_SERVER: ${{ secrets.RD_ID_SERVER }}
          RD_RELAY_SERVER: ${{ secrets.RD_RELAY_SERVER }}
          RD_API_SERVER: ${{ secrets.RD_API_SERVER }}
          RD_KEY: ${{ secrets.RD_KEY }}
          RD_PRESET_PASSWORD: ${{ secrets.RD_PRESET_PASSWORD }}
          RD_RELEASE_REPO: ${{ secrets.RD_RELEASE_REPO }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python3 ./pipeline/scripts/gen_embedded_config.py src/embedded_config.rs
          python3 - <<'EOF'
          s = open('src/embedded_config.rs', encoding='utf-8').read()
          lines = s.count('\n')
          syms = ['UPDATE_RELEASE_REPO_OWNER', 'UPDATE_RELEASE_REPO_NAME',
                  'unattended_hide_cm', 'fn init', 'LOCKED_SERVER_OPTIONS']
          missing = [k for k in syms if k not in s]
          print(f'self-check: bytes={len(s)} lines={lines} missing={missing}')
          if missing or lines < 30:
              raise SystemExit('generated embedded_config.rs is incomplete!')
          EOF

      - name: Inject release version (Cargo.toml + Cargo.lock, keep --locked valid)
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'EOF'
          import os, re
          tag = os.environ['RELEASE_TAG']
          s = open('Cargo.toml', encoding='utf-8').read()
          s = re.sub(r'(?m)^(version\s*=\s*)"[^"]*"', lambda m: m.group(1) + f'"{tag}"', s, count=1)
          open('Cargo.toml', 'w', encoding='utf-8', newline='').write(s)
          s = open('Cargo.lock', encoding='utf-8').read()
          s = re.sub(r'(name = "rustdesk"\r?\nversion = )"[^"]*"', lambda m: m.group(1) + f'"{tag}"', s, count=1)
          open('Cargo.lock', 'w', encoding='utf-8', newline='').write(s)
          print('injected release version:', tag)
          EOF

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/rustdesk/rustdesk/issues/155685 - use rustdesk custom engine
      - name: Replace engine with rustdesk custom flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $engineDir = "$env:FLUTTER_ROOT/bin/cache/artifacts/engine/windows-x64-release"
          if (-not (Test-Path $engineDir)) { throw "Engine dir not found: $engineDir" }
          Get-ChildItem ./windows-x64-release | Move-Item -Destination $engineDir -Force

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "${{ env.FLUTTER_VERSION }}" == "3.24.5" ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-custom-x64
          workspaces: |
            .

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true

      - name: Build rustdesk
        shell: pwsh
        run: |
          # Regenerate in-place right before compilation (idempotent): this
          # closes any window where an intermediate step could disturb the
          # generated module between its dedicated step and cargo.
          python3 ./pipeline/scripts/gen_embedded_config.py src/embedded_config.rs
          if (-not (Test-Path src/embedded_config.rs)) { throw 'src/embedded_config.rs missing before build!' }
          $lc = (Get-Content src/embedded_config.rs | Measure-Object -Line).Lines
          $sha = (Get-FileHash src/embedded_config.rs -Algorithm SHA256).Hash.Substring(0,16)
          Write-Host "embedded_config.rs regenerated, lines: $lc, sha256: $sha"
          Write-Host "--- first lines of generated module ---"
          Get-Content src/embedded_config.rs | ForEach-Object { Write-Host $_ }
          Write-Host "--- end of generated module ---"
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Virtual display driver files
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          # Printer driver files (optional)
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1\.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } else {
                Write-Output "Printer driver checksums do not match, ignore the files."
            }
          } catch {
              Write-Host "Ignore the printer driver error."
          }

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download top most window artifacts
        uses: actions/download-artifact@v4
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{ env.VERSION }}-x86_64.exe

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build msi
        shell: pwsh
        run: |
          pushd ./res/msi
          # MSI ProductVersion only accepts numeric x.y[.z]; strip the pipeline suffix (e.g. 1.4.9-3 -> 1.4.9)
          $msiVersion = if ('${{ env.VERSION }}' -match '^(\d+\.\d+\.\d+)') { $Matches[1] } else { '${{ env.VERSION }}' }
          python preprocess.py --arp -d ../../rustdesk -v $msiVersion
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName ../../SignOutput/rustdesk-${{ env.VERSION }}-x86_64.msi
          sha256sum ../../SignOutput/rustdesk-*.msi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-custom-windows-x64
          retention-days: 7
          path: |
            ./SignOutput/rustdesk-*.exe
            ./SignOutput/rustdesk-*.msi

  publish:
    name: Publish release
    needs: [build-windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/update the Release in this repository
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-custom-windows-x64
          path: ./dist

      - name: Publish release
        shell: bash
        env:
          # Same-repo publishing uses the built-in token (no PAT needed).
          # Point vars.RELEASE_REPO at another repository to publish there
          # instead; that requires the RELEASE_PAT secret with Contents:write.
          GH_TOKEN_SELF: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          ls -la ./dist
          if [ -n "${{ vars.RELEASE_REPO }}" ] && [ "${{ vars.RELEASE_REPO }}" != "${GITHUB_REPOSITORY}" ]; then
            PUBLISH_REPO="${{ vars.RELEASE_REPO }}"
            GH_TOKEN="$GH_TOKEN_PAT"
            if [ -z "$GH_TOKEN" ]; then
              echo "::error::vars.RELEASE_REPO targets external repository '${PUBLISH_REPO}' but secret RELEASE_PAT is not set."
              echo "::error::Create a fine-grained PAT with Contents:read/write on that repo, or clear vars.RELEASE_REPO to publish here."
              exit 1
            fi
          else
            PUBLISH_REPO="${GITHUB_REPOSITORY}"
            GH_TOKEN="$GH_TOKEN_SELF"
          fi
          export GH_TOKEN
          echo "Publishing ${VERSION} to ${PUBLISH_REPO}"
          DISPLAY_VERSION="${VERSION%%-*}"
          if gh release view "$VERSION" --repo "$PUBLISH_REPO" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, uploading assets."
            gh release upload "$VERSION" ./dist/rustdesk-* --repo "$PUBLISH_REPO" --clobber
            gh release edit "$VERSION" --repo "$PUBLISH_REPO" --title "$DISPLAY_VERSION"
          else
            gh release create "$VERSION" \
              --repo "$PUBLISH_REPO" \
              --title "$DISPLAY_VERSION" \
              --notes "Windows installer for RustDesk ${DISPLAY_VERSION}." \
              ./dist/rustdesk-*
          fi

  alert:
    name: Alert on failure
    needs: [generate-bridge, build-topmost-window, build-windows-x64, publish]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create failure issue (deduplicated)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Build failed for ${{ inputs.tag }}"
          EXISTING=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --search "${TITLE} in:title" --json number --jq 'length')
          if [ "$EXISTING" -eq 0 ]; then
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --title "${TITLE}" \
              --body "Build run failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${{ github.run_id }}

          Common causes and fixes are documented in README.md > Troubleshooting."
          else
            echo "Failure issue already open."
          fi
