name: Fast Compile Check

# 分段快速验证：只做 checkout + 补丁 + 配置生成 + cargo check，
# 不跑 vcpkg / Flutter / 打包 / 发布。用于补丁与生成器的分钟级迭代。

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream ref (default 1.4.9)'
        default: '1.4.9'
        type: string
      regenerate_only:
        description: 'Only run the config generator and print stats (skip cargo)'
        default: 'false'
        type: string

permissions:
  contents: read

env:
  UPSTREAM_REPO: rustdesk/rustdesk
  SOURCE_REF: ${{ inputs.upstream_ref || '1.4.9' }}
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.upstream_ref || '1.4.9' }}
          submodules: recursive

      - name: Checkout this pipeline repo (for patches)
        uses: actions/checkout@v4
        with:
          path: pipeline

      - name: Apply custom client patches
        shell: bash
        run: git apply --whitespace=nowarn --verbose ./pipeline/patches/custom-client.patch

      - name: Generate embedded config from secrets
        shell: bash
        env:
          RD_ID_SERVER: ${{ secrets.RD_ID_SERVER }}
          RD_RELAY_SERVER: ${{ secrets.RD_RELAY_SERVER }}
          RD_API_SERVER: ${{ secrets.RD_API_SERVER }}
          RD_KEY: ${{ secrets.RD_KEY }}
          RD_PRESET_PASSWORD: ${{ secrets.RD_PRESET_PASSWORD }}
          RD_RELEASE_REPO: ${{ secrets.RD_RELEASE_REPO }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python3 ./pipeline/scripts/gen_embedded_config.py src/embedded_config.rs
          wc -l src/embedded_config.rs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: fastcheck

      # scrap's build.rs requires VCPKG_ROOT with libyuv available
      - name: Setup vcpkg (for scrap)
        shell: bash
        env:
          VCPKG_COMMIT_ID: 120deac3062162151622ca4860575a33844ba10b
        run: |
          git clone https://github.com/microsoft/vcpkg /opt/vcpkg
          cd /opt/vcpkg
          git checkout "$VCPKG_COMMIT_ID"
          ./bootstrap-vcpkg.sh -disableMetrics
          ./vcpkg install libyuv --triplet x64-linux
          echo "VCPKG_ROOT=/opt/vcpkg" >> "$GITHUB_ENV"

      - name: Install prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl g++ git libpam0g-dev \
            libasound2-dev libunwind-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgtk-3-dev libpulse-dev \
            libva-dev libvdpau-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev libxfixes-dev nasm wget pkg-config libvpx-dev libaom-dev pkg-config

      - name: Show generated module structure
        shell: bash
        run: |
          grep -n "^pub \|^const \|^fn " src/embedded_config.rs || true

      - name: Cargo check (library)
        if: inputs.regenerate_only != 'true'
        shell: bash
        run: cargo check --locked --lib
